server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip_static on;

    location = /sw.js {
        try_files /sw.js =404;
        add_header Cache-Control "no-cache, stale-if-error=86400";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, stale-if-error=86400";
    }
}
